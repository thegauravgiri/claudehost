# runner has full shell access via Claude Code - its port is never published.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  litellm:
    build:
      context: ./litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    mem_limit: 512m
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
      CLAUDEBOX_API_MODE_TOKEN: ${CLAUDEBOX_API_MODE_TOKEN}
      MALLOC_ARENA_MAX: 2
    volumes:
      # shared with claudebox so the auto-workspace cleanup hook can delete
      # the directories it creates (see litellm/auto_workspace_callback.py)
      - ./workspaces:/workspaces
    depends_on:
      db:
        condition: service_healthy
      runner:
        condition: service_started
    networks:
      - backend

  dind:
    # An isolated Docker daemon for runner's agent sessions to use when a
    # repo needs its own docker-compose.yml (real PHP/Node/DB toolchain) to
    # run tests correctly, instead of every repo's stack needing to be
    # pre-installed in runner's own image. Deliberately a separate daemon
    # from the host's: privileged is required for nested Docker, so this
    # stays contained to its own sandbox rather than mounting the host's
    # real docker.sock, which would hand runner's agent sessions the
    # functional equivalent of host root (control over every container on
    # this machine, including anuvad's, and a trivial escape to the host).
    image: docker:27-dind
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - dind_storage:/var/lib/docker
      # Same path as runner's own mount below - a project's docker-compose.yml
      # bind-mounting "." (e.g. "./:/var/www/html") is resolved by *this*
      # daemon, not runner's shell, so the path has to exist here too, at
      # the identical absolute path runner sees it at.
      - ./workspaces:/workspace
    mem_limit: 4g
    networks:
      - backend

  runner:
    # Replaces claudebox: runs the real `claude` CLI directly (no third-party
    # container image/API-mode shim) behind the same OpenAI-compatible
    # surface claudebox exposed, so litellm/config.yaml and the orchestrator
    # don't need to know the difference. See runner/server.py + executor.py.
    build:
      context: ./runner
    restart: unless-stopped
    environment:
      RUNNER_API_TOKEN: ${CLAUDEBOX_API_MODE_TOKEN}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      # Fallback only - the orchestrator always sends its own value via the
      # X-Aicodebox-Timeout-Seconds header. See core.AGENT_TIMEOUT_SECONDS
      # in the orchestrator service below for why this needs to be generous.
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-3600}
      # Points the docker CLI (installed, no local daemon) at the dind
      # sidecar - a `docker compose up` an agent session runs lands there,
      # isolated from the host's real Docker. No TLS: internal-only network.
      DOCKER_HOST: tcp://dind:2375
      CLAUDEBOX_GIT_NAME: ${CLAUDEBOX_GIT_NAME}
      CLAUDEBOX_GIT_EMAIL: ${CLAUDEBOX_GIT_EMAIL}
      # No gitconfig is ever written for these - git reads the GIT_AUTHOR_*/
      # GIT_COMMITTER_* env vars directly instead, so they're the actual
      # source of commit identity for agent commits.
      GIT_AUTHOR_NAME: ${CLAUDEBOX_GIT_NAME}
      GIT_AUTHOR_EMAIL: ${CLAUDEBOX_GIT_EMAIL}
      GIT_COMMITTER_NAME: ${CLAUDEBOX_GIT_NAME}
      GIT_COMMITTER_EMAIL: ${CLAUDEBOX_GIT_EMAIL}
      # ./ssh mounts as a directory, so the key generated at ssh/claudebox
      # lands at this nested path, not somewhere ssh checks by default.
      GIT_SSH_COMMAND: ssh -i /home/aicode/.ssh/claudebox/claudebox -o UserKnownHostsFile=/home/aicode/.ssh/known_hosts -o IdentitiesOnly=yes
      # gh CLI and PR creation for the Jira agent flow. A single fine-grained
      # PAT on a machine user, not the SSH deploy key: a deploy key can only
      # attach to one repo, so it can't serve a multi-repo repos.yaml.
      GH_TOKEN: ${GH_TOKEN}
      # No GH_REPO here: it'd need to vary per-request (each issue targets a
      # different repo) and there's no per-request env-var mechanism, only
      # CLI extra-args. The agent prompt passes --repo explicitly on every gh
      # command instead (see orchestrator/core.py's PROMPT_TEMPLATE).
      # Rewrites https://github.com/... git operations to authenticate with
      # GH_TOKEN, without ever writing the token into a repo's remote URL
      # (which would persist on disk and leak via `git remote -v`).
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${GH_TOKEN}@github.com/.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/
    volumes:
      - claude_auth:/home/aicode/.claude
      - ./ssh:/home/aicode/.ssh/claudebox:ro
      - ./workspaces:/workspace
      # Shared bare-repo store for the Jira agent's git worktrees (see
      # orchestrator/git_ops.py). Read-write: agent commits/pushes write
      # directly into these bare repos through the worktree's commondir.
      - ./repos:/repos
    security_opt:
      - no-new-privileges:true
    # Raised from 4g/2 for the Jira agent flow: cpus is a CFS quota, not a
    # cpuset, so nproc still reports the host's core count regardless -
    # autodetecting build tools (jest, make -j, cargo) size their worker
    # count off nproc and will oversubscribe a low cpus limit, times however
    # many issues run concurrently. Tune to actual host capacity.
    mem_limit: 7g
    cpus: 2
    pids_limit: 512
    depends_on:
      dind:
        condition: service_started
    networks:
      - backend

  orchestrator:
    build:
      context: ./orchestrator
    restart: unless-stopped
    ports:
      # Not published to the world: see claudehost_edge below. Host-only, for
      # local debugging (curl localhost:8090/healthz).
      - "127.0.0.1:8090:8090"
    environment:
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${ORCHESTRATOR_LITELLM_KEY}
      # How long a single agent call (cloning, installing deps, running a
      # project's own Docker-based test suite, pushing) gets before runner
      # gives up and this process's own client stops waiting. Several real
      # fix rounds against a heavier repo (Laravel + Playwright) ran right up
      # against the old 1800s default and got cut off before they could
      # commit - raise this if that keeps happening even at 3600s.
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-3600}
      # Points the docker CLI (installed, no local daemon) at the same
      # isolated dind sandbox runner's agent sessions use, never the host's
      # real docker - git_ops._force_remove's only use for it, cleaning up a
      # worktree a container running as root inside dind left root-owned
      # files in (this process runs as uid 1000, see `user:` below, and
      # can't remove those on its own).
      DOCKER_HOST: tcp://dind:2375
      JIRA_BASE_URL: ${JIRA_BASE_URL}
      JIRA_EMAIL: ${JIRA_EMAIL}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN}
      JIRA_WEBHOOK_SECRET: ${JIRA_WEBHOOK_SECRET}
      GH_TOKEN: ${GH_TOKEN}
      GH_WEBHOOK_SECRET: ${GH_WEBHOOK_SECRET}
      CODERABBIT_LOGIN: ${CODERABBIT_LOGIN:-coderabbitai[bot]}
      CODERABBIT_MAX_ITERATIONS: ${CODERABBIT_MAX_ITERATIONS:-10}
      CODERABBIT_CI_COMBINE_WAIT_SECONDS: ${CODERABBIT_CI_COMBINE_WAIT_SECONDS:-300}
      CI_CHECK_APP_SLUG: ${CI_CHECK_APP_SLUG:-github-actions}
      # How long an Actions run can sit queued/in_progress before a fix round
      # gives up on it, cancels it via the API, and runs the full suite
      # itself instead - what should have happened the one time CI ran for
      # 6 hours straight without finishing.
      CI_STUCK_SECONDS: ${CI_STUCK_SECONDS:-900}
      # Same insteadOf rewrite as runner, so the orchestrator's own git
      # operations (clone/fetch/worktree add) authenticate identically.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${GH_TOKEN}@github.com/.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/
    volumes:
      # Same absolute paths as the runner: git worktree bakes absolute paths
      # into its metadata, so the directory a worktree is created under here
      # must resolve to the same path the runner sees it at.
      - ./workspaces:/workspace
      - ./repos:/repos
      - ./orchestrator:/app
      - orchestrator_state:/state
    # Matches the aicode user's uid/gid in the runner. Anything this service
    # creates under /workspace or /repos must be writable by that uid, not
    # just root - see orchestrator/README for why this isn't optional.
    user: "1000:1000"
    depends_on:
      litellm:
        condition: service_started
      dind:
        condition: service_started
    networks:
      backend:
      # Lets a reverse proxy running in another docker-compose project reach
      # this service by the "claudehost-orchestrator" alias without being on
      # "backend" too - "backend" also carries the runner, which has full
      # shell access via Claude Code, and the proxy container has no
      # business reaching that.
      edge:
        aliases:
          - claudehost-orchestrator

networks:
  backend:
  # Shared with anuvad's docker-compose project (its Caddy proxies
  # claudehost.gauravgiri.com.np through it) - external on both sides, so
  # neither project claims ownership of a network the other also depends on.
  edge:
    name: claudehost_edge
    external: true

volumes:
  postgres_data:
  claude_auth:
  orchestrator_state:
  dind_storage:
