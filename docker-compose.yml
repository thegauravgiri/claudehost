# claudebox has full shell access via Claude Code - its port is never published.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  litellm:
    build:
      context: ./litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
      CLAUDEBOX_API_MODE_TOKEN: ${CLAUDEBOX_API_MODE_TOKEN}
    volumes:
      # shared with claudebox so the auto-workspace cleanup hook can delete
      # the directories it creates (see litellm/auto_workspace_callback.py)
      - ./workspaces:/workspaces
    depends_on:
      db:
        condition: service_healthy
      claudebox:
        condition: service_started
    networks:
      - backend

  claudebox:
    # latest/v2.4.2 crash-loop on startup (packaging bug). v2.3.9 is confirmed working.
    image: psyb0t/claudebox:v2.3.9
    restart: unless-stopped
    environment:
      CLAUDEBOX_API_MODE: "1"
      CLAUDEBOX_API_MODE_TOKEN: ${CLAUDEBOX_API_MODE_TOKEN}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      CLAUDEBOX_GIT_NAME: ${CLAUDEBOX_GIT_NAME}
      CLAUDEBOX_GIT_EMAIL: ${CLAUDEBOX_GIT_EMAIL}
      # ./ssh mounts as a directory, so the key generated at ssh/claudebox
      # lands at this nested path, not somewhere ssh checks by default.
      GIT_SSH_COMMAND: ssh -i /home/aicode/.ssh/claudebox/claudebox -o UserKnownHostsFile=/home/aicode/.ssh/known_hosts -o IdentitiesOnly=yes
    volumes:
      - claude_auth:/home/aicode/.claude
      - ./ssh:/home/aicode/.ssh/claudebox:ro
      - ./workspaces:/workspace
    # cap_drop: ALL breaks this image's entrypoint (needs CAP_DAC_OVERRIDE)
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2
    pids_limit: 512
    networks:
      - backend

networks:
  backend:

volumes:
  postgres_data:
  claude_auth:
