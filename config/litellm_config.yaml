# Routes to claudebox's OpenAI-compatible adapter (real Claude Code sessions).
# Workspace selection: header `X-Aicodebox-Workspace: <name>` (v2.3.9 ignores
# the `workspace` body field), via extra_headers on the client.
model_list:
  - model_name: claude-haiku
    litellm_params:
      model: openai/haiku
      api_base: http://claudebox:8080/openai/v1
      api_key: os.environ/CLAUDEBOX_API_MODE_TOKEN
  - model_name: claude-sonnet
    litellm_params:
      model: openai/sonnet
      api_base: http://claudebox:8080/openai/v1
      api_key: os.environ/CLAUDEBOX_API_MODE_TOKEN
  - model_name: claude-opus
    litellm_params:
      model: openai/opus
      api_base: http://claudebox:8080/openai/v1
      api_key: os.environ/CLAUDEBOX_API_MODE_TOKEN

general_settings:
  store_model_in_db: true
  forward_client_headers_to_llm_api: true # needed for X-Aicodebox-Workspace

litellm_settings:
  drop_params: false
