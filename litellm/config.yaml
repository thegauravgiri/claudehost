# Workspace selection: X-Aicodebox-Workspace header, not the `workspace`
# body field.
#
# num_retries: 0 on every model below - a call runs a real Claude Code session
# against runner, which can take minutes. The OpenAI SDK litellm uses to reach
# an openai-compatible endpoint retries 5xx/timeouts by default, silently
# re-running the whole session (and spending its quota again) after a timeout.
# A failure from runner should propagate once, cleanly, to the caller instead.
#
# Extra Claude subscriptions: add a model (here or in the UI) with
#   extra_headers: {"X-Aicodebox-Account": "<name>"}
# to route it to the account <name> from claude-accounts.env. No header uses
# the default account (CLAUDE_CODE_OAUTH_TOKEN).
model_list:
  - model_name: claude-haiku
    litellm_params:
      model: openai/haiku
      api_base: http://runner:8080/openai/v1
      api_key: os.environ/CLAUDEBOX_API_MODE_TOKEN
      num_retries: 0
    model_info:
      pricing_ref: claude-haiku-4-5
  - model_name: claude-sonnet
    litellm_params:
      model: openai/sonnet
      api_base: http://runner:8080/openai/v1
      api_key: os.environ/CLAUDEBOX_API_MODE_TOKEN
      num_retries: 0
    model_info:
      pricing_ref: claude-sonnet-5
  - model_name: claude-opus
    litellm_params:
      model: openai/opus
      api_base: http://runner:8080/openai/v1
      api_key: os.environ/CLAUDEBOX_API_MODE_TOKEN
      num_retries: 0
    model_info:
      pricing_ref: claude-opus-5
  - model_name: claude-opusplan
    litellm_params:
      model: openai/opusplan
      api_base: http://runner:8080/openai/v1
      api_key: os.environ/CLAUDEBOX_API_MODE_TOKEN
      num_retries: 0
    model_info:
      pricing_ref: claude-opus-5

general_settings:
  store_model_in_db: true
  forward_client_headers_to_llm_api: true

litellm_settings:
  drop_params: true
  callbacks: auto_workspace_callback.proxy_handler_instance
